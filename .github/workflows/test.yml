name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: agent-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime and graph dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit and numerical tests
        run: python3 -m unittest discover -s tests -v
      - name: Thirty-case Agent evaluation
        run: python3 evals/run_evaluation.py --output /tmp/evaluation_report.json
      - name: Multilingual final-polish evaluation
        run: python3 evals/run_multilingual_evaluation.py --output /tmp/multilingual_report.json
      - name: Retrieval quality evaluation
        run: python3 evals/run_retrieval_evaluation.py --output /tmp/retrieval_report.json
      - name: Pedagogy behavior evaluation
        run: python3 evals/run_pedagogy_evaluation.py --output /tmp/pedagogy_report.json
      - name: Bounded-Agent safety evaluation
        run: python3 evals/run_safety_evaluation.py --output /tmp/safety_report.json
      - name: v1 Tutor acceptance set (offline mock)
        run: python3 evals/run_v1_acceptance.py --output /tmp/v1_acceptance_report.json
      - name: Evidence sufficiency evaluation
        run: python3 evals/run_answerability_evaluation.py > /tmp/answerability_report.json
      - name: Grounded 40-KP course coverage evaluation
        run: |
          python3 scripts/build_course_coverage_cases.py
          python3 evals/run_course_coverage_evaluation.py --output /tmp/course_coverage_report.json
      - name: RAG credibility hard-set evaluation
        run: |
          python3 scripts/build_course_hard_cases.py
          python3 evals/run_rag_credibility_evaluation.py \
            --output /tmp/rag_credibility_report.json \
            --markdown /tmp/rag_credibility_report.md
      - name: Independent course holdout evaluation
        run: python3 evals/run_holdout_evaluation.py --output /tmp/course_holdout_report.json
      - name: Course RAG coverage audit
        run: python3 scripts/audit_course_rag_coverage.py /tmp/course_rag_coverage.json
      - name: Notebook visualization E2E verification
        run: python3 scripts/verify_notebook_visualizations.py --output /tmp/visualization_e2e_report.json
      - name: Experiment routing evaluation
        run: python3 evals/run_experiment_routing_evaluation.py --output /tmp/experiment_routing_report.json
      - name: KP-level personalization evaluation
        run: python3 evals/run_personalization_evaluation.py --output /tmp/personalization_report.json
      - name: Generate current evaluation manifest
        run: |
          python3 evals/generate_evaluation_manifest.py \
            --main /tmp/evaluation_report.json \
            --retrieval /tmp/retrieval_report.json \
            --pedagogy /tmp/pedagogy_report.json \
            --safety /tmp/safety_report.json \
            --answerability /tmp/answerability_report.json \
            --course-coverage /tmp/course_coverage_report.json \
            --experiment-routing /tmp/experiment_routing_report.json \
            --visualization-e2e /tmp/visualization_e2e_report.json \
            --credibility /tmp/rag_credibility_report.json \
            --output /tmp/evaluation_manifest.json
      - name: Record local node-latency benchmark
        run: python3 evals/run_latency_benchmark.py --repetitions 1 --output /tmp/latency_benchmark.json
      - name: Preserve evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports-py${{ matrix.python-version }}
          path: |
            /tmp/evaluation_report.json
            /tmp/multilingual_report.json
            /tmp/retrieval_report.json
            /tmp/pedagogy_report.json
            /tmp/safety_report.json
            /tmp/v1_acceptance_report.json
            /tmp/answerability_report.json
            /tmp/course_coverage_report.json
            /tmp/rag_credibility_report.json
            /tmp/rag_credibility_report.md
            /tmp/course_holdout_report.json
            /tmp/course_rag_coverage.json
            /tmp/visualization_e2e_report.json
            /tmp/experiment_routing_report.json
            /tmp/personalization_report.json
            /tmp/evaluation_manifest.json
            /tmp/latency_benchmark.json
          retention-days: 14

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate hardened Compose contract
        run: docker compose config --quiet
      - name: Build unprivileged interview image
        run: docker build -t stochastic-tutor-agent:test .
      - name: Smoke-test hardened service
        run: |
          docker compose up --build --detach
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null; then
              curl --fail --silent http://127.0.0.1:8000/openapi.json >/dev/null
              curl --fail --silent http://127.0.0.1:8000/metrics | grep --quiet stochlab_ready
              exit 0
            fi
            sleep 1
          done
          docker compose logs
          exit 1
      - name: Remove smoke-test resources
        if: always()
        run: docker compose down --volumes

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and browser test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-e2e.txt
          python -m playwright install --with-deps chromium
      - name: Run real browser acceptance tests
        env:
          LLM_API_KEY: ""
          LLM_MODEL: ""
          TUTOR_MEMORY_PATH: ${{ runner.temp }}/stochlab-e2e.sqlite3
        run: python -m pytest tests/e2e -q
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-failures
          path: artifacts/e2e_failures
          if-no-files-found: ignore
