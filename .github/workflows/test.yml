name: test

on:
  push:
  pull_request:

jobs:
  agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and numerical tests
        run: python3 -m unittest discover -s tests -v
      - name: Thirty-case Agent evaluation
        run: python3 evals/run_evaluation.py --output /tmp/evaluation_report.json
